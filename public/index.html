<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; border-radius: 1rem; z-index: 1; }
        .glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(75, 85, 99, 0.3); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-white">
                    GPS <span class="text-blue-500">Live</span>
                </h1>
                <p class="text-slate-400 mt-1">Real-time device tracking system</p>
            </div>
            <div id="connection-badge" class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-full border border-slate-800">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-sm font-medium text-slate-300" id="last-update">Waiting for data...</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Device Name/IMEI</p>
                <h3 id="imei-display" class="text-xl font-mono font-bold text-blue-400 truncate">---</h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Current Speed</p>
                <h3 id="speed-display" class="text-2xl font-bold italic">0.0 <span class="text-sm not-italic font-normal text-slate-500">km/h</span></h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Heading</p>
                <h3 id="heading-display" class="text-2xl font-bold uppercase">0° <span id="direction-text" class="text-sm font-normal text-slate-500">North</span></h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Battery</p>
                <h3 id="battery-display" class="text-2xl font-bold text-green-400">0.0 <span class="text-sm font-normal text-slate-500">V</span></h3>
            </div>
        </div>

        <div class="relative">
            <div id="map" class="shadow-2xl border border-slate-800"></div>
            <div class="absolute bottom-6 right-6 z-[1000] flex flex-col gap-2">
                <button onclick="centerMap()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition-all text-sm uppercase">
                    Center on Device
                </button>
            </div>
        </div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([36.8065, 10.1815], 13);
        let marker = L.marker([36.8065, 10.1815]).addTo(map);
        let currentPos = [36.8065, 10.1815];

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        function getDirection(degrees) {
            const sectors = ["North", "North-East", "East", "South-East", "South", "South-West", "West", "North-West"];
            return sectors[Math.round(degrees / 45) % 8];
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/gps/latest');
                const data = await res.json();

                if (data && data.latitude) {
                    currentPos = [data.latitude, data.longitude];
                    
                    marker.setLatLng(currentPos);
                    
                    document.getElementById('imei-display').innerText = data.device_imei || 'Unknown';
                    document.getElementById('speed-display').innerHTML = `${data.speed} <span class="text-sm not-italic font-normal text-slate-500">km/h</span>`;
                    document.getElementById('heading-display').innerText = `${data.direction}°`;
                    document.getElementById('direction-text').innerText = getDirection(data.direction);
                    document.getElementById('battery-display').innerText = `${data.battery_voltage} V`;
                    document.getElementById('last-update').innerText = 'Last Sync: ' + new Date(data.timestamp).toLocaleTimeString();
                    
                    const battElem = document.getElementById('battery-display');
                    battElem.className = data.battery_voltage < 3.5 ? 'text-2xl font-bold text-red-500' : 'text-2xl font-bold text-green-400';
                }
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('last-update').innerText = 'Connection Error';
            }
        }

        function centerMap() {
            map.flyTo(currentPos, 16);
        }

        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
